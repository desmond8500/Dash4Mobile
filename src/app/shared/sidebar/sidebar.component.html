<ion-menu contentId="main-content">

  <ion-header>
    <ion-toolbar>

      <ion-title>Menu</ion-title>

      <ion-buttons slot="end">
        <ion-menu-toggle>
          <ion-button >
            <ion-icon name="close" aria-hidden="true"></ion-icon>
          </ion-button>
        </ion-menu-toggle>
      </ion-buttons>

    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    @for(menu of menus; track menu.id){
      <h2>{{ menu.name }}</h2>
      <ul>
        @for(submenu of menu.list; track submenu.id){
          @if (submenu.route) {
            <li [routerLink]="submenu.route">{{ submenu.name }}</li>
          }
          @if (!submenu.route) {
            <li style="color:red">{{ submenu.name }}</li>
          }
        }
      </ul>
    }

  </ion-content>

  <ion-footer>
    <ion-button expand="block" color="danger">Déconnexion</ion-button>
  </ion-footer>

</ion-menu>
