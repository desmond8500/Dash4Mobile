<app-header title="Clients"></app-header>

<ion-content class="ion-padding">

  <ion-list>
    @for(client of clients.data; track client.id) {
      <app-client-card [client]="client"></app-client-card>
    }
  </ion-list>

  <div class="pagination">
    <ion-button
      (click)="changePage(page - 1)"
      [disabled]="page === 1">
      Précédent
    </ion-button>

    <ion-button color="medium"> {{ page }} </ion-button>

    <ion-button
      (click)="changePage(page + 1)"
      [disabled]="page === lastPage">
      Suivant
    </ion-button>

  </div>


</ion-content>
