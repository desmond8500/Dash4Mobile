<ion-accordion-group>
  @for(note of notes?.data; track note.id) {
    <ion-accordion >
      <ion-item slot="header" color="light">
        <ion-label>{{ note.titre }}</ion-label>
      </ion-item>

      <div  slot="content" class="content">
        <markdown [data]="note.description"> </markdown>
      </div>
    </ion-accordion>
  }
</ion-accordion-group>
