  <ion-item [routerLink]="['/project', projet()?.id]" detail="true">
    <ion-thumbnail slot="start">
      <img alt="Silhouette of a person's head" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
    </ion-thumbnail>
    <ion-label>
      <h2>{{ projet()?.name }}</h2>
      <p>{{ projet()?.description }}</p>
    </ion-label>
  </ion-item>
