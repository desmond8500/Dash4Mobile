<app-header title="Projet" [back]="back"></app-header>

<ion-content class="ion-padding">
  <app-project-card [projet]="projet"  target="_blank"></app-project-card>

  <div class="menus">
    @for(menu of menus; track menu.id){
      <ion-button class="menu" [routerLink]="menu.route">
        {{ menu.name }}
      </ion-button>
    }
  </div>

  <a href="https://dash3.yonkou.info/projet/{{ projet.id }}" target="_blank" class="btn">
    Dossier projet
  </a>

</ion-content>
