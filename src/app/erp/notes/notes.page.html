<app-header title="Notes" [back]="back"></app-header>

<ion-content class="ion-padding">
  <ion-refresher>
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <div class="d-flex justify-content-between align-items-center">
    <h2>Notes</h2>
    <div>
      <ion-button size="small" id="open-modal">+ Note</ion-button>
    </div>
  </div>


  <app-project-notes-card [projet_id]="projet_id"></app-project-notes-card>

  <hr>


  <ion-modal trigger="open-modal" (willDismiss)="onWillDismiss($event)">
    <ng-template>
      <ion-footer>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancel()">Cancel</ion-button>
          </ion-buttons>
          <ion-title>Welcome</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="confirm()" [strong]="true">Confirm</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-footer>

      <ion-content class="ion-padding">
        <form [formGroup]="form">
          <ion-item>
            <ion-input label="Titre de la note" labelPlacement="stacked" type="text" placeholder="Note"
              formControlName="titre"></ion-input>
          </ion-item>
          <ion-item>
            <ion-textarea
              label="Description de la note"
              labelPlacement="stacked"
              type="text"
              placeholder="Description"
              formControlName="description"
            ></ion-textarea>
          </ion-item>


        </form>


      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
