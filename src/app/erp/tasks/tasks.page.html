<app-header title="Taches" [back]="back"></app-header>

<ion-content class="ion-padding">

  <ion-refresher id="refresher" slot="fixed" (ionRefresh)="reload($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @for(task of tasks.data; track task.id){
    <app-task-card [task]="task" (event)="getTasks()"></app-task-card>
  }


</ion-content>

<ion-footer>
  <ion-toolbar>
    <app-task-form (event)="store($event)"></app-task-form>
  </ion-toolbar>
</ion-footer>
