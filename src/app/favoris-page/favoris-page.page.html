<app-header title="Favoris"></app-header>

<ion-content fullscreen="true" class="ion-padding">
  <ion-refresher id="refresher" slot="fixed" (ionRefresh)="reload($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-breadcrumbs [maxItems]="4" [itemsBeforeCollapse]="2">
    @for(menu of menus; track menu.id){
    <ion-breadcrumb [routerLink]="menu.route">
      <ion-icon slot="start" [name]="menu.icon"></ion-icon>
      {{ menu.name }}
    </ion-breadcrumb>
    }
  </ion-breadcrumbs>

  <ion-text>
    <h2>Clients</h2>
  </ion-text>
  @for(client of favoris?.clients; track client.id){
  <app-client-card [client]="client"></app-client-card>
  }
  <ion-text>
    <h2>Projets</h2>
  </ion-text>
  @for(projet of favoris?.projets; track projet.id){
  <app-project-card [projet]="projet"></app-project-card>
  }




</ion-content>
