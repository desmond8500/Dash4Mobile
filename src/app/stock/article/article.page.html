<app-header title="Article" [back]="back"></app-header>

<ion-content class="ion-padding">

  <app-article-card [article]="article"></app-article-card>

  <ion-item>
    <ion-label>
      <h3>Description</h3>
      <markdown [data]="article.description"></markdown>
    </ion-label>
  </ion-item>

  <ion-item>
    <ion-label>
      <h3>Marque</h3>
      <p>{{ article.brand_name }}</p>
    </ion-label>
  </ion-item>

  <ion-item>
    <ion-label>
      <h3>Fournisseur</h3>
      <p>{{ article.provider_name }}</p>
    </ion-label>
  </ion-item>

  <div class="row p-2">
    <div class="col-md-12">
      <h3 class="text-center">Images</h3>
    </div>
    @for(image of images; track image.id){
      <ion-avatar>
        <img [src]="image.image" alt="Image" class="image">
      </ion-avatar>
    }
  </div>


  <h3 class="text-center">Liens</h3>
  @for(link of links; track link.id){
    <a [href]="link.link" target="_blank" class="mb-1">{{ link.name }}</a> <br/>
  }

  <h3 class="text-center">Documents</h3>
  @for(document of documents; track document.id){
    <a [href]="document.link" target="_blank" class="mb-1">{{ document.name }}</a> <br/>
  }


</ion-content>
