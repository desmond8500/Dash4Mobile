<ion-item-sliding>
  <ion-item button="true">
    <ion-thumbnail aria-hidden="true" slot="start">
      <img alt="" [src]="article().image" />
    </ion-thumbnail>
    <ion-label>
      <h3 class="name">{{ article().designation }}</h3>
      <div class="reference">{{ article().reference }}</div>
    </ion-label>
    <div>
      <ion-text class="price">{{ article().price | number }} F</ion-text>
    </div>
  </ion-item>
  <ion-item-options slot="end">
    <ion-item-option color="warning" routerLink="/article/{{ article().id }}">
      <ion-icon slot="icon-only" name="information"></ion-icon>
    </ion-item-option>
    <ion-item-option color="tertiary">
      <ion-icon slot="icon-only" name="create"></ion-icon>
    </ion-item-option>
    <ion-item-option color="danger" expandable="true">
      <ion-icon slot="icon-only" name="trash"></ion-icon>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
