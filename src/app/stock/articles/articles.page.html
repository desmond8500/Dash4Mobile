<app-header title="Articles" [back]="back"></app-header>

<ion-content class="ion-padding">
  <ion-refresher id="refresher" slot="fixed" (ionRefresh)="reload($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-searchbar></ion-searchbar>

  @for(article of articles; track article.id){
    <app-article-card [article]="article"></app-article-card>
  }

  <div class="pagination">
    <ion-button
      (click)="changePage(page - 1)"
      [disabled]="page === 1">
      Précédent
    </ion-button>

    @if(page > 1) {
      <ion-button color="primary"> 1 </ion-button>
    }
    <ion-button color="medium"> {{ page }} </ion-button>
    @if (lastPage > page) {
      <ion-button color="primary"> {{ lastPage }} </ion-button>
    }
    <ion-button
      (click)="changePage(page + 1)"
      [disabled]="page === lastPage">
      Suivant
    </ion-button>
  </div>

</ion-content>
