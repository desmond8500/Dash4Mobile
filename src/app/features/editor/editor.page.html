<app-header title="Editeur" [back]="back"></app-header>

<ion-content class="ion-padding">

  <div class="d-flex">
    <div class="sidebar">
      <div class="flex d-flex-between align-items-center">
        <input type="text" placeholder="Nom du projet" [(ngModel)]="projectName" style="font-size: 22px;">
        <button (click)="saveProject()" class="btn"> + </button>
      </div>

      <div class="d-flex-between align-items-center">
        <h2>Projets</h2>
        <div>
          <div class="mouse">
            X: {{ mouseX }} -  Y: {{ mouseY }}
          </div>
        </div>
      </div>
      @for(projet of projects; track projet.id) {
        <div class="project-item d-flex-between align-items-center" (click)="getProject(projet.id)">
          <div (click)="getProject(projet.id)">{{ projet.name }}</div>
          <div>
            <button class="btn2" > M </button>
            <button class="btn2 btn3" (click)="deleteProject(projet.id)"> S </button>
          </div>
        </div>
      }

      @if (selectedProject) {
        <div>
          <h2>Articles</h2>
          <div>
            <div draggable="true" (dragstart)="onDragStart($event, 'detector')" class="btn">
            🚨 Détecteur
          </div>
          </div>
        </div>

        <div class="equipements">
          <h2>Équipements</h2>
          <div>
            <button (click)="addCamera()" class="btn"> + caméra </button>
            <button (click)="add_image()" class="btn"> + image </button>
          </div>
          <button class="btn" (click)="updateProject()">
            Mettre à jour
          </button>

        </div>
      }
      <hr>
      <h2>Exporter</h2>
      <button class="btn" (click)="exportPNG()"> Export PNG </button>
      <button class="btn" (click)="exportPDF()"> Export PDF </button>


    </div>

    <div class="main">
      <div class="d-flex">

        <button (click)="saveProject()" class="btn"> Sauvegarder </button>
        <button (click)="getProjects()" class="btn"> Récupérer les projets </button>
      </div>

      <div class="d-flex-between align-items-center">
        <div class="">
          <button class="btn" (click)="zoomIn()"> Zoom + </button>
          <button class="btn" (click)="zoomOut()"> Zoom - </button>
          <button class="btn" (click)="resetView()"> Reset </button>
        </div>

        <input type="file" (change)="uploadPlan($event)">

        <div>

        </div>

      </div>

      <hr>

      <div
        #container
        class="container"
        (dragover)="onDragOver($event)"
        (drop)="onDrop($event)">
      </div>

    </div>

  </div>







</ion-content>
